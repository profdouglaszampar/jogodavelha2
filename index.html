<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jogo da Velha Quiz</title>

<style>

*{
box-sizing:border-box;
}

html,body{
width:100%;
max-width:100%;
overflow-x:hidden;
}

body{
font-family:Arial;
background:#0E1D2E;
color:white;
text-align:center;
margin:0;
font-size:clamp(18px,2.2vw,30px);
}

h1{color:#FF6400;font-size:clamp(2rem,5.6vw,3.3rem)}

.screen{
display:none;
padding:clamp(12px,2vw,20px) clamp(12px,4vw,40px);
margin:0 auto;
width:min(100%,1200px);
}
.active{display:block}

#questionScreen{
font-size:clamp(1.4rem,4vw,3rem);
text-align:center;
padding:min(20vh,160px) clamp(12px,4vw,20px);
box-sizing:border-box;
gap:12px;
line-height:1.1;
}

#questionScreen.active{
display:flex;
flex-direction:column;
align-items:center;
justify-content:flex-start;
height:100vh;
}

p{margin:12px 0}

button{
background:#FF6400;
border:none;
padding:12px 18px;
font-size:clamp(1rem,2.6vw,2.1rem);
border-radius:8px;
cursor:pointer;
margin:10px;
color:white;
max-width:100%;
}

input{
padding:10px;
font-size:clamp(1rem,2.8vw,2.25rem);
max-width:100%;
}

.groupSetup{
margin:20px auto;
padding:12px;
border:1px solid rgba(255,255,255,0.2);
border-radius:12px;
width:min(100%,720px);
}

#setup{
font-size:clamp(14px,1.4vw,20px);
}

#setup h1{
font-size:clamp(1.6rem,3.2vw,2.4rem);
margin-bottom:10px;
}

#setup h3{
font-size:clamp(1rem,2vw,1.35rem);
margin:8px 0;
}

#setup input{
font-size:clamp(0.95rem,1.8vw,1.2rem);
}

#setup button{
font-size:clamp(0.95rem,1.8vw,1.2rem);
}

.groupGrid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:14px;
width:min(100%,980px);
margin:0 auto;
}

.groupGrid .groupSetup{
width:100%;
margin:0;
}

.studentList{
display:flex;
flex-direction:column;
gap:8px;
margin-top:10px;
}

.studentList input{
width:min(100%,460px);
margin:0 auto;
}

.addStudentBtn{
font-size:clamp(0.9rem,2.2vw,1.2rem);
padding:8px 12px;
}

.gameLayout{
display:grid;
grid-template-columns:minmax(260px,0.95fr) minmax(300px,1.05fr);
gap:clamp(14px,3vw,40px);
align-items:start;
width:100%;
max-width:1100px;
margin:0 auto;
}

.gameInfo{
text-align:left;
display:flex;
flex-direction:column;
gap:clamp(8px,1.5vw,18px);
min-width:0;
}

.gameBoardPanel{
display:flex;
justify-content:center;
align-items:flex-start;
min-width:0;
}

.gameHint{
margin:0;
font-size:clamp(1rem,2.6vw,2rem);
opacity:0.95;
}

#g1{
margin:0;
font-size:clamp(1.5rem,4.6vw,3.6rem);
word-break:break-word;
}

#game.active{
display:flex;
align-items:center;
justify-content:center;
min-height:100vh;
}

.board{
display:grid;
grid-template-columns:repeat(3,minmax(0,1fr));
gap:clamp(6px,1.6vw,10px);
width:min(100%,540px);
margin:0 auto;
}

.cell{
width:100%;
aspect-ratio:1/1;
background:white;
color:#0E1D2E;
font-size:clamp(42px,10vw,90px);
display:flex;
align-items:center;
justify-content:center;
border-radius:10px;
cursor:pointer;
}

.powerTarget{
outline:3px solid #00ff88;
box-shadow:0 0 12px rgba(0,255,136,0.6);
}

#questionBox{
font-size:clamp(1.5rem,4.2vw,3.6rem);
margin-bottom:20px;
word-break:break-word;
}

#powerBox{
font-size:clamp(1rem,2.4vw,1.05em);
color:#ffd166;
margin-bottom:10px;
letter-spacing:0.5px;
text-transform:uppercase;
display:none;
}

.gapInput{
font-size:clamp(1.2rem,4vw,3.2rem);
padding:6px;
width:min(90vw,260px);
text-align:center;
}

.gapInput.inline{
width:min(90vw,500px);
}

.gapInput.block{
width:min(92vw,760px);
}

.correct{
color:#00ff88;
font-weight:bold;
}

.wrong{
color:#ff4d4d;
font-weight:bold;
}

.timer{
height:20px;
background:#444;
width:min(92vw,460px);
margin:auto;
border-radius:10px;
overflow:hidden;
}

.bar{
height:100%;
background:#FF6400;
width:100%;
transition:width 1s linear;
}

.answerBox{
font-size:clamp(1.2rem,3.6vw,2.9rem);
margin-top:20px;
word-break:break-word;
}

#winner{
font-size:clamp(2rem,10vw,5.6rem);
color:#FF6400;
animation:pulse 1s infinite;
}

#finalWinner{
font-size:clamp(2.2rem,11vw,6.75rem);
color:#FF6400;
animation:pulse 1s infinite;
line-height:1.2;
text-shadow:0 0 18px rgba(255,100,0,0.6);
word-break:break-word;
}

.winnerName{
color:#FF6400;
font-weight:bold;
}

#finalDetails{
font-size:clamp(1.2rem,4.2vw,3.2rem);
margin-top:20px;
}

#finalScreen.active{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
height:100vh;
gap:20px;
}

#confetti{
position:fixed;
inset:0;
pointer-events:none;
overflow:hidden;
}

#confetti span{
position:absolute;
width:10px;
height:14px;
top:-10%;
background:var(--c);
left:var(--x);
transform:rotate(var(--r));
animation:confetti-fall var(--d) linear infinite;
opacity:0.9;
}

@keyframes confetti-fall{
0%{transform:translateY(-10vh) rotate(var(--r))}
100%{transform:translateY(110vh) rotate(calc(var(--r) + 360deg))}
}

.powerOverlay{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:radial-gradient(circle at center, rgba(14,29,46,0.98) 0%, rgba(8,14,24,0.95) 70%);
opacity:0;
pointer-events:none;
transition:opacity .2s ease;
z-index:999;
}

.powerOverlay.show{
opacity:1;
pointer-events:auto;
}

#powerOverlayText{
font-size:clamp(2rem,8vw,6rem);
font-weight:bold;
color:#ff4d4d;
text-shadow:0 0 20px rgba(255,77,77,0.6);
animation:powerPulse 0.8s infinite, powerShake 0.2s infinite;
text-align:center;
padding:0 40px;
}

.powerOverlay.bomb #powerOverlayText{
color:#ffd166;
text-shadow:0 0 20px rgba(255,209,102,0.6);
}

#nukeVideoOverlay{
position:fixed;
inset:0;
background:#000;
opacity:0;
pointer-events:none;
transition:opacity .2s ease;
z-index:1001;
}

#nukeVideoOverlay.show{
opacity:1;
pointer-events:auto;
}

#nukeVideo{
width:100vw;
height:100vh;
object-fit:cover;
background:#000;
}

body.screenShake{
animation:screenShake .2s linear infinite;
}

@keyframes screenShake{
0%{transform:translate(0,0)}
20%{transform:translate(-8px,4px)}
40%{transform:translate(6px,-5px)}
60%{transform:translate(-6px,-3px)}
80%{transform:translate(5px,4px)}
100%{transform:translate(0,0)}
}

@keyframes powerPulse{
0%{transform:scale(1)}
50%{transform:scale(1.1)}
100%{transform:scale(1)}
}

@keyframes powerShake{
0%{transform:translateY(0)}
25%{transform:translateY(-2px)}
50%{transform:translateY(2px)}
75%{transform:translateY(-1px)}
100%{transform:translateY(0)}
}

#markAnimLayer{
position:fixed;
inset:0;
pointer-events:none;
z-index:998;
}

.markGhost{
position:fixed;
transform:translate(-50%,-50%);
transition:left .9s ease, top .9s ease;
font-weight:bold;
color:#0E1D2E;
}

.ghostHidden{
opacity:0;
}

.nukeFade{
animation:nukeFade .8s forwards;
}

@keyframes nukeFade{
0%{opacity:1;transform:scale(1)}
100%{opacity:0;transform:scale(0.2) rotate(20deg)}
}

.markers{
margin-top:8px;
font-size:clamp(1rem,2.8vw,2.25rem);
word-break:break-word;
}

.markers span{
display:inline-block;
margin:0 8px 8px 0;
}

.markSymbol{
display:inline-block;
font-weight:bold;
font-size:clamp(1.1rem,3vw,2.6rem);
color:#FF6400;
margin-right:6px;
}

.markSymbol.alt{
font-size:clamp(1.2rem,3.4vw,3.2rem);
}

.turnPulse{
border:2px solid #FF6400;
border-radius:999px;
padding:4px 10px;
animation:turnPulse 1s infinite;
}

@media (max-width:900px){
.gameLayout{
grid-template-columns:1fr;
}

.gameInfo{
text-align:center;
}

.groupGrid{
grid-template-columns:1fr;
}
}

@keyframes turnPulse{
0%{box-shadow:0 0 0 0 rgba(255,100,0,0.7)}
70%{box-shadow:0 0 0 12px rgba(255,100,0,0)}
100%{box-shadow:0 0 0 0 rgba(255,100,0,0)}
}

@keyframes pulse{
0%{transform:scale(1)}
50%{transform:scale(1.2)}
100%{transform:scale(1)}
}

</style>
</head>

<body>

<div id="setup" class="screen active">

<h1>Jogo da Velha Quiz</h1>

<p>Enviar arquivo .txt</p>
<input type="file" id="csv" accept=".txt,text/plain">

<div class="groupGrid">
<div class="groupSetup">
<h3>Grupo 1</h3>
<input id="t1" placeholder="Nome do grupo 1">
<div id="students0" class="studentList"></div>
<button class="addStudentBtn" type="button" onclick="addStudentInput(0)">+ Nome</button>
</div>

<div class="groupSetup">
<h3>Grupo 2</h3>
<input id="t2" placeholder="Nome do grupo 2">
<div id="students1" class="studentList"></div>
<button class="addStudentBtn" type="button" onclick="addStudentInput(1)">+ Nome</button>
</div>
</div>

<button onclick="startGame()">Começar</button>

</div>


<div id="game" class="screen">

<div class="gameLayout">
<div class="gameInfo">
<h1 id="turn"></h1>
<p class="gameHint">Escolha uma casa</p>
<h2 id="g1"></h2>
<div id="g1Marks" class="markers"></div>
</div>
<div class="gameBoardPanel">
<div id="board0" class="board"></div>
</div>
</div>

</div>


<div id="questionScreen" class="screen">

<div id="powerBox"></div>

<div id="questionBox"></div>

<div id="inputArea"></div>

<div class="timer">
<div class="bar" id="bar"></div>
</div>

<br>

<h2 id="feedback"></h2>

<button id="continueBtn" style="display:none" onclick="continueGame()">Continuar</button>

</div>

<div id="finalScreen" class="screen">

<div id="finalWinner"></div>
<div id="finalDetails"></div>
<div id="confetti"></div>

</div>

<div id="powerOverlay" class="powerOverlay">
<div id="powerOverlayText"></div>
</div>
<div id="nukeVideoOverlay">
<video id="nukeVideo" src="nuke.mp4" preload="auto" playsinline muted></video>
</div>
<div id="markAnimLayer"></div>

<script>

let questions=[]
let used=[]

let teams=[]
let studentsByTeam=[[],[]]
let responderState=[
{order:[],index:0},
{order:[],index:0}
]
let turn=0
let currentTeamTurn=0

let boards=[
["","","","","","","","",""]
]
let results=[null]
let boardCells=[[]]

let selectedCell
let selectedBoard
let selectedIndex
let currentQuestion
let currentHasGap
let pendingPower=null
let activePower=null
let powerMode=null
let powerGroupIndex=-1
let powerTurnOffset=0

let timer
let time=45
let continueTimer
let waitingContinue=false
let cheatBuffer=""
let powerOverlayTimer
let nukeVideoTimer
let currentQuestionTotalTime=45
let correctMove=false
const BASE_QUESTION_TIME=45

function parseQuestionFile(text){

questions=[]
used=[]

let rows=text.split(/\r?\n/)
let currentWeight=1
let started=false

rows.forEach((r)=>{

let line=r.trim()
if(!line) return

let anyWeightMatch=line.match(/peso\s*[:=-]?\s*(\d+(?:[.,]\d+)?)/i)
if(!started){
if(!anyWeightMatch) return
started=true
let firstValue=parseFloat(anyWeightMatch[1].replace(",","."))
if(!Number.isNaN(firstValue) && firstValue>0){
currentWeight=firstValue
}
}

let weightLineMatch=line.match(/^peso\s*[:=-]?\s*(\d+(?:[.,]\d+)?)$/i)
if(weightLineMatch){
let value=parseFloat(weightLineMatch[1].replace(",","."))
if(!Number.isNaN(value) && value>0){
currentWeight=value
}
return
}

let workingLine=line
let extraTime=0
let extraMatch=workingLine.match(/^\(\+\s*(\d+)\s*s\)\s*/i)
if(extraMatch){
extraTime=parseInt(extraMatch[1],10)
workingLine=workingLine.replace(/^\(\+\s*\d+\s*s\)\s*/i,"").trim()
}

let inlineWeight=currentWeight
let inlineWeightMatch=workingLine.match(/\|\|\s*peso\s*(\d+(?:[.,]\d+)?)\s*$/i)
if(inlineWeightMatch){
let value=parseFloat(inlineWeightMatch[1].replace(",","."))
if(!Number.isNaN(value) && value>0){
inlineWeight=value
}
workingLine=workingLine.replace(/\|\|\s*peso\s*\d+(?:[.,]\d+)?\s*$/i,"").trim()
}

let separatorIndex=workingLine.indexOf(";")
if(separatorIndex===-1) return

let questionText=workingLine.slice(0,separatorIndex).trim()
let answerText=workingLine.slice(separatorIndex+1).trim()

if(!questionText || !answerText) return

let answerList=answerText.split(",").map(a=>a.trim()).filter(a=>a.length>0)
if(answerList.length===0) return

questions.push({
q:questionText,
a:answerList.map(a=>a.toLowerCase()),
aDisplay:answerList,
weight:inlineWeight,
extraTime:extraTime
})
})

}

function splitQuestion(q){
q=formatQuestionMarkup(q)
let match=q.match(/_{3,}/)

if(!match) return {hasGap:false,before:q,after:""}

let start=match.index
let end=start+match[0].length

return {hasGap:true,before:q.slice(0,start),after:q.slice(end)}
}

function formatQuestionMarkup(text){
return text
.replace(/&lt;br\s*\/?&gt;/gi,"<br>")
.replace(/<br\s*\/?>/gi,"<br>")
.replace(/&lt;b&gt;/gi,"<b>")
.replace(/&lt;\/b&gt;/gi,"</b>")
}

function addStudentInput(teamIndex,initialValue){
let list=document.getElementById("students"+teamIndex)
if(!list) return

let input=document.createElement("input")
input.type="text"
input.placeholder="Nome do estudante"
input.value=initialValue||""
input.className="studentInput"
list.appendChild(input)
}

function ensureInitialStudentInputs(){
for(let t=0;t<2;t++){
let list=document.getElementById("students"+t)
if(!list) continue
if(list.querySelectorAll("input").length===0){
addStudentInput(t,"")
addStudentInput(t,"")
}
}
}

function setupResponders(){
responderState=[
{order:[],index:0},
{order:[],index:0}
]

for(let t=0;t<2;t++){
let count=studentsByTeam[t].length
let order=[]
for(let i=0;i<count;i++) order.push(i)
shuffleArray(order)
responderState[t]={order:order,index:0}
}
}

function getCurrentResponderName(teamIndex){
let list=studentsByTeam[teamIndex]||[]
if(list.length===0) return ""

let state=responderState[teamIndex]
if(!state || state.order.length!==list.length){
let order=[]
for(let i=0;i<list.length;i++) order.push(i)
shuffleArray(order)
responderState[teamIndex]={order:order,index:0}
state=responderState[teamIndex]
}

let studentIndex=state.order[state.index]
if(studentIndex===undefined) return list[0]
return list[studentIndex]
}

function advanceResponder(teamIndex){
let list=studentsByTeam[teamIndex]||[]
if(list.length===0) return

let state=responderState[teamIndex]
if(!state || state.order.length!==list.length){
let order=[]
for(let i=0;i<list.length;i++) order.push(i)
shuffleArray(order)
responderState[teamIndex]={order:order,index:0}
state=responderState[teamIndex]
}

state.index++

if(state.index>=state.order.length){
let previous=state.order.slice()
shuffleArray(state.order)

if(state.order.length>1){
let same=true
for(let i=0;i<state.order.length;i++){
if(state.order[i]!==previous[i]){
same=false
break
}
}

if(same){
state.order.push(state.order.shift())
}
}

state.index=0
}
}

function advanceTurn(){
advanceResponder(currentTeamTurn)
turn++
currentTeamTurn=(currentTeamTurn+1)%2
}

function getDisplaySymbol(boardIndex,mark){
return mark
}

function getTeamSymbol(teamIndex){
if(teamIndex==0) return "X"
if(teamIndex==1) return "O"
return ""
}

function setCellMark(boardIndex,cellIndex,mark){
boards[boardIndex][cellIndex]=mark
let cell=boardCells[boardIndex][cellIndex]
cell.innerText=mark==""?"":getDisplaySymbol(boardIndex,mark)
cell.classList.remove("ghostHidden")
cell.classList.remove("nukeFade")
}

function isPowerTurn(){
let group=Math.floor(turn/3)

if(group!==powerGroupIndex){
powerGroupIndex=group
powerTurnOffset=Math.floor(Math.random()*3)
}

return (turn%3)===powerTurnOffset
}

function weightedRandom(options){
let total=options.reduce((s,o)=>s+o.weight,0)
let r=Math.random()*total

for(let o of options){
if(r<o.weight) return o
r-=o.weight
}

return options[options.length-1]
}

function pickWeightedQuestion(list){
if(list.length==0) return null

let total=list.reduce((sum,q)=>sum+((q.weight && q.weight>0)?q.weight:1),0)
if(total<=0) return list[Math.floor(Math.random()*list.length)]

let r=Math.random()*total

for(let q of list){
r-=((q.weight && q.weight>0)?q.weight:1)
if(r<0) return q
}

return list[list.length-1]
}

function countMarks(boardIndex){
return boards[boardIndex].filter(c=>c!="").length
}

function countMarksOf(boardIndex,mark){
return boards[boardIndex].filter(c=>c==mark).length
}

function countEmpty(boardIndex){
return boards[boardIndex].filter(c=>c=="").length
}

function getAvailableType1Powers(){
let list=[]
let mark=currentTeamTurn==0?"X":"O"
let opponent=mark=="X"?"O":"X"

if(countMarksOf(selectedBoard,opponent)>0){
list.push({
id:"eraseOpponent",
desc:"Escolher uma marcaÃ§Ã£o do outro time para ser apagada",
requiresSelection:true
})
list.push({
id:"convertOpponent",
desc:"Escolher uma marcaÃ§Ã£o do outro time para ser trocada e virar uma marcaÃ§Ã£o sua",
requiresSelection:true
})
}

if(countEmpty(selectedBoard)>=2){
list.push({
id:"extraMark",
desc:"Marque mais um quadrado no seu jogo",
requiresSelection:true
})
}

return list
}

function pickPower(){
if(!isPowerTurn()) return null

let type1List=getAvailableType1Powers()
let typeOptions=[]
let boardHasMinMarks=countMarks(selectedBoard)>=3

if(type1List.length>0) typeOptions.push({type:"type1",weight:1})
typeOptions.push({type:"type2",weight:1})
if(boardHasMinMarks){
typeOptions.push({type:"type3",weight:0.5})
}

let chosenType=weightedRandom(typeOptions).type

if(chosenType=="type1"){
let power=type1List[Math.floor(Math.random()*type1List.length)]
power.type="type1"
return power
}

if(chosenType=="type2"){
let list=[
{desc:"Todo mundo do seu time pode te ajudar",weight:2},
{desc:"Escolha uma pessoa do seu time para te ajudar",weight:3},
{desc:"Acerte e ganhe uma bala",weight:1},
{desc:"Acerte e escolha alguÃ©m para ganhar uma bala",weight:1}
]

let chosen=weightedRandom(list)
return {type:"type2",desc:chosen.desc}
}

let list3=[
{id:"nuke",desc:"Bomba nuclear"},
{id:"bomb",desc:"Bomba"}
]

let chosen=list3[Math.floor(Math.random()*list3.length)]
return {type:"type3",id:chosen.id,desc:chosen.desc}
}

function clearBoard(boardIndex){
for(let i=0;i<9;i++){
setCellMark(boardIndex,i,"")
}
}

function shuffleArray(arr){
for(let i=arr.length-1;i>0;i--){
let j=Math.floor(Math.random()*(i+1))
let tmp=arr[i]
arr[i]=arr[j]
arr[j]=tmp
}
}

function showPowerOverlayText(text,type,duration){
powerOverlayText.innerText=text
powerOverlay.className="powerOverlay show "+(type=="bomb"?"bomb":"nuke")
clearTimeout(powerOverlayTimer)
powerOverlayTimer=setTimeout(()=>{
powerOverlay.className="powerOverlay"
},duration)
}

function playNukeVideo(done){
let overlay=document.getElementById("nukeVideoOverlay")
let video=document.getElementById("nukeVideo")

if(!overlay || !video){
done()
return
}

let finished=false

function finish(){
if(finished) return
finished=true
clearTimeout(nukeVideoTimer)
video.pause()
video.currentTime=0
video.onended=null
video.onerror=null
overlay.classList.remove("show")
done()
}

overlay.classList.add("show")
video.currentTime=0

let playPromise=video.play()

if(playPromise && playPromise.catch){
playPromise.catch(()=>{
setTimeout(finish,2500)
})
}

video.onended=finish
video.onerror=finish
nukeVideoTimer=setTimeout(finish,20000)
}

function runBombChaos(duration,done){
let finishAt=Date.now()+duration
document.body.classList.add("screenShake")

function loop(){
animateBombShuffle(()=>{
if(Date.now()<finishAt){
setTimeout(loop,40)
return
}

document.body.classList.remove("screenShake")
done()
})
}

loop()
}

function animateNuke(boardIndex,done){
let cells=[]

for(let i=0;i<9;i++){
if(boards[boardIndex][i]!="") cells.push(boardCells[boardIndex][i])
}

if(cells.length==0){
done()
return
}

cells.forEach(c=>c.classList.add("nukeFade"))

setTimeout(()=>{
clearBoard(boardIndex)
cells.forEach(c=>c.classList.remove("nukeFade"))
done()
},900)
}

function animateBombShuffle(done){
let marks=[]

for(let b=0;b<boards.length;b++){
for(let i=0;i<9;i++){
if(boards[b][i]!="") marks.push({b:b,i:i,mark:boards[b][i]})
}
}

if(marks.length==0){
done()
return
}

let positions=[]
for(let i=0;i<boards.length*9;i++) positions.push(i)
shuffleArray(positions)

let targets=positions.slice(0,marks.length)

marks.forEach(m=>{
boardCells[m.b][m.i].classList.add("ghostHidden")
})

markAnimLayer.innerHTML=""

let ghosts=[]

marks.forEach((m,idx)=>{
let fromRect=boardCells[m.b][m.i].getBoundingClientRect()
let targetPos=targets[idx]
let tb=Math.floor(targetPos/9)
let ti=targetPos%9
let toRect=boardCells[tb][ti].getBoundingClientRect()

let ghost=document.createElement("div")
ghost.className="markGhost"
ghost.innerText=getDisplaySymbol(m.b,m.mark)
ghost.style.fontSize=getComputedStyle(boardCells[m.b][m.i]).fontSize
ghost.style.left=(fromRect.left+fromRect.width/2)+"px"
ghost.style.top=(fromRect.top+fromRect.height/2)+"px"
ghost.dataset.targetLeft=(toRect.left+toRect.width/2)
ghost.dataset.targetTop=(toRect.top+toRect.height/2)
markAnimLayer.appendChild(ghost)
ghosts.push(ghost)
})

requestAnimationFrame(()=>{
ghosts.forEach(g=>{
g.style.left=g.dataset.targetLeft+"px"
g.style.top=g.dataset.targetTop+"px"
})
})

setTimeout(()=>{
markAnimLayer.innerHTML=""

for(let b=0;b<boards.length;b++){
for(let i=0;i<9;i++){
setCellMark(b,i,"")
boardCells[b][i].classList.remove("ghostHidden")
}
}

marks.forEach((m,idx)=>{
let targetPos=targets[idx]
let tb=Math.floor(targetPos/9)
let ti=targetPos%9
setCellMark(tb,ti,m.mark)
})

done()
},950)
}

function handleType3Power(power){
pendingPower=null
activePower=null
powerBox.innerText=""
powerBox.style.display="none"

switchScreen("game")

if(power.id=="nuke"){
playNukeVideo(()=>{
animateNuke(selectedBoard,()=>{
advanceTurn()
updateTurn()
})
})
return
}

runBombChaos(15000,()=>{
advanceTurn()
updateTurn()
})
}

function applyImmediatePower(power){
return
}

function startPowerSelection(power){
let mark=currentTeamTurn==0?"X":"O"
let opponent=mark=="X"?"O":"X"

powerMode={
id:power.id,
board:selectedBoard,
mark:mark,
opponent:opponent
}

setPowerTargets()
document.getElementById("turn").innerText="Escolha a aÃ§Ã£o do poder"
}

function clearPowerTargets(){
for(let b=0;b<boards.length;b++){
for(let i=0;i<9;i++){
boardCells[b][i].classList.remove("powerTarget")
}
}
}

function setPowerTargets(){
clearPowerTargets()

if(!powerMode) return

if(powerMode.id=="eraseOpponent" || powerMode.id=="convertOpponent"){
for(let i=0;i<9;i++){
if(boards[powerMode.board][i]==powerMode.opponent){
boardCells[powerMode.board][i].classList.add("powerTarget")
}
}
return
}

if(powerMode.id=="extraMark"){
for(let i=0;i<9;i++){
if(boards[powerMode.board][i]==""){
boardCells[powerMode.board][i].classList.add("powerTarget")
}
}
}
}

function handlePowerClick(board,index,cell){
if(!powerMode) return

if(powerMode.id=="eraseOpponent"){
if(board==powerMode.board && boards[board][index]==powerMode.opponent){
setCellMark(board,index,"")
finishPowerSelection()
}
return
}

if(powerMode.id=="convertOpponent"){
if(board==powerMode.board && boards[board][index]==powerMode.opponent){
setCellMark(board,index,powerMode.mark)
finishPowerSelection()
}
return
}

if(powerMode.id=="extraMark"){
if(board==powerMode.board && boards[board][index]==""){
setCellMark(board,index,powerMode.mark)
finishPowerSelection()
}
}
}

function finishPowerSelection(){
clearPowerTargets()
powerMode=null

let result=checkWin(selectedBoard)

if(result){
results[selectedBoard]=result
updateGameHeader(selectedBoard)

if(results[0]){
showFinalResults()
return
}
}

advanceTurn()
updateTurn()
}

if(!file){
alert("Selecione um arquivo .txt com as perguntas.")
return
}

let reader=new FileReader()

reader.onload=function(e){

parseQuestionFile(e.target.result)
if(questions.length===0){

}

teams=[
t1.value.trim()||"Grupo 1",
t2.value.trim()||"Grupo 2"
]

studentsByTeam=[
Array.from(document.querySelectorAll("#students0 input")).map(i=>i.value.trim()).filter(v=>v.length>0),
Array.from(document.querySelectorAll("#students1 input")).map(i=>i.value.trim()).filter(v=>v.length>0)
]

if(studentsByTeam[0].length===0) studentsByTeam[0]=["Aluno 1"]
if(studentsByTeam[1].length===0) studentsByTeam[1]=["Aluno 1"]

powerGroupIndex=-1
powerTurnOffset=0
powerMode=null
pendingPower=null
activePower=null
clearInterval(timer)
clearTimeout(continueTimer)
waitingContinue=false
results=[null]
boards=[
["","","","","","","","",""]
]
boardCells=[[]]
document.getElementById("board0").innerHTML=""

g1.innerText=teams[0]+" vs "+teams[1]
g1Marks.innerHTML="<span id='team0'><span class='markSymbol'>"+getTeamSymbol(0)+"</span>"+teams[0]+"</span><span id='team1'><span class='markSymbol'>"+getTeamSymbol(1)+"</span>"+teams[1]+"</span>"

for(let c=0;c<9;c++){

turnText=team+" - Responde: "+responder
}

return

selectCell(board,index,cell)

function selectCell(board,index,cell){

if(cell.innerText!="") return
if(results[board]) return

selectedCell=cell

selectedIndex=index

showQuestion()

}

function showQuestion(){

let available=questions.filter(q=>!used.includes(q))

if(available.length==0){
used=[]
available=questions.filter(q=>!used.includes(q))
}

currentQuestion=pickWeightedQuestion(available)
if(!currentQuestion) return

used.push(currentQuestion)

let power=pickPower()
pendingPower=power && power.type=="type1"?power:null
activePower=null

if(power && (power.type=="type1" || power.type=="type2")){
powerBox.innerText="Poder: "+power.desc
powerBox.style.display="block"
}else{
powerBox.innerText=""
powerBox.style.display="none"
}

if(power && power.type=="type3"){
handleType3Power(power)
return
}

renderQuestionUI()

}

function renderQuestionUI(){
let parts=splitQuestion(currentQuestion.q)
currentHasGap=parts.hasGap

if(currentHasGap){
questionBox.innerHTML=
parts.before+"<input id='gapInput' class='gapInput inline'>"+(parts.after||"")
inputArea.innerHTML=""
}else{
questionBox.innerHTML=parts.before
inputArea.innerHTML="<input id='gapInput' class='gapInput block'>"
}

feedback.innerHTML=""
continueBtn.style.display="none"

switchScreen("questionScreen")

document.getElementById("gapInput").focus()

startTimer()
}

function startTimer(){

time=BASE_QUESTION_TIME+(currentQuestion.extraTime||0)
if(time<1) time=1
currentQuestionTotalTime=time
bar.style.width="100%"

timer=setInterval(()=>{

time--

bar.style.width=(time/currentQuestionTotalTime*100)+"%"

if(time<=0) checkAnswer()

},1000)

}

function checkAnswer(){

clearInterval(timer)
clearTimeout(continueTimer)

let input=document.getElementById("gapInput")
let student=input.value.trim()
let correctList=currentQuestion.a

let parts=splitQuestion(currentQuestion.q)

let normalized=student.toLowerCase()

if(correctList.includes(normalized)){

if(currentHasGap){
questionBox.innerHTML=
parts.before+"<span class='correct'>"+student+"</span>"+(parts.after||"")
inputArea.innerHTML=""
}else{
questionBox.innerHTML=parts.before
inputArea.innerHTML="<div class='answerBox'><span class='correct'>"+student+"</span></div>"
}

feedback.innerHTML="Resposta correta."

correctMove=true
activePower=pendingPower

}else{

if(currentHasGap){
questionBox.innerHTML=
parts.before+"<span class='wrong'>"+student+"</span>"+(parts.after||"")
inputArea.innerHTML=""
}else{
questionBox.innerHTML=parts.before
inputArea.innerHTML="<div class='answerBox'><span class='wrong'>"+student+"</span></div>"
}

feedback.innerHTML=
"<div class='answerBox'>Gabarito: <span class='correct'>"+currentQuestion.aDisplay.join(", ")+"</span></div>"

correctMove=false
activePower=null

}

continueBtn.style.display="none"
waitingContinue=true
cheatBuffer=""

continueTimer=setTimeout(()=>{
continueBtn.style.display="inline-block"
waitingContinue=false
},30000)

}

function continueGame(){

waitingContinue=false
clearTimeout(continueTimer)

if(correctMove){

let mark=currentTeamTurn==0?"X":"O"

setCellMark(selectedBoard,selectedIndex,mark)

let result=checkWin(selectedBoard)

if(result){
results[selectedBoard]=result
updateGameHeader(selectedBoard)

if(results[0]){
showFinalResults()
return
}
}

}

if(correctMove && activePower){
if(activePower.requiresSelection){
switchScreen("game")
startPowerSelection(activePower)
activePower=null
pendingPower=null
return
}else{
applyImmediatePower(activePower)
}
}

activePower=null
pendingPower=null

advanceTurn()

switchScreen("game")

updateTurn()

}

function checkWin(b){

let board=boards[b]

let wins=[
[0,1,2],[3,4,5],[6,7,8],
[0,3,6],[1,4,7],[2,5,8],
[0,4,8],[2,4,6]
]

for(let w of wins){

if(board[w[0]] &&
board[w[0]]==board[w[1]] &&
board[w[1]]==board[w[2]]){

return board[w[0]]

}

}

if(board.every(c=>c!="")) return "draw"

return null

}

function updateGameHeader(gameIndex){
let title=g1
let base=teams[0]+" vs "+teams[1]

let result=results[gameIndex]

if(!result){
title.innerText=base
return
}

if(result=="draw"){
title.innerText=base+" - Empate"
return
}

let winner=result=="X"?teams[0]:teams[1]

title.innerText=base+" - Vencedor: "+winner
}

function highlightTurn(){
let ids=["team0","team1"]
ids.forEach(id=>{
let el=document.getElementById(id)
if(el) el.classList.remove("turnPulse")
})

let current=document.getElementById("team"+currentTeamTurn)
if(current) current.classList.add("turnPulse")
}


function showFinalResults(){
let winners=[]

if(results[0]=="X") winners.push(teams[0])
if(results[0]=="O") winners.push(teams[1])

let message=""
let hasWinners=winners.length>0

if(winners.length==1){
message="<span class='winnerName'>"+winners[0]+"</span>"
}else{
message="EMPATE"
}

finalWinner.innerHTML=message
finalDetails.innerHTML=""
finalDetails.style.display="none"

renderConfetti(hasWinners)

switchScreen("finalScreen")
}

function renderConfetti(active){
if(!active){
confetti.innerHTML=""
return
}

if(confetti.children.length>0) return

let colors=["#FF6400","#00ff88","#4dd0ff","#ffd166","#f94144","#9b5de5"]
let pieces=60
let html=""

for(let i=0;i<pieces;i++){
let c=colors[i%colors.length]
let x=Math.floor(Math.random()*100)+"%"
let r=Math.floor(Math.random()*360)+"deg"
let d=(6+Math.random()*6).toFixed(2)+"s"
html+="<span style='--c:"+c+";--x:"+x+";--r:"+r+";--d:"+d+"'></span>"
}

confetti.innerHTML=html
}

document.addEventListener("keypress",function(e){

if(e.key==="Enter"){
if(document.getElementById("questionScreen").classList.contains("active") && document.getElementById("gapInput")){
checkAnswer()
}
return
}

if(waitingContinue && e.key>="0" && e.key<="9"){
cheatBuffer=(cheatBuffer+e.key).slice(-3)

if(cheatBuffer==="123"){
waitingContinue=false
clearTimeout(continueTimer)
continueGame()
}
}

})

function switchScreen(id){

document.querySelectorAll(".screen")
.forEach(s=>s.classList.remove("active"))

document.getElementById(id).classList.add("active")

}

ensureInitialStudentInputs()
